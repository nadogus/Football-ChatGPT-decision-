name: evidence-engine-ci
on:
  push:
    paths-ignore: ["daily/**", "ledger/**", "decisions/**"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile *.py
      - run: python football_evidence_engine.py
      - run: pip install pytest
      - run: pytest -q
