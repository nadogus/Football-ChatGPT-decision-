name: evidence-engine-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python football_evidence_engine.py
      - run: pip install pytest
      - run: pytest -q
