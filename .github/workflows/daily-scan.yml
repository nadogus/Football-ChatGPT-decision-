name: daily-evidence-scan

on:
  push:
    branches: [data-pipeline-v2]
    paths-ignore: ["daily/**", "ledger/**", "decisions/**"]
  schedule:
    - cron: "37 5 * * *"   # her gün 05:37 UTC (08:37 TSİ): dünü kapat, bugünü tara
  workflow_dispatch:
    inputs:
      mode:
        description: "scan | settle | both"
        default: "both"
      date:
        description: "Tarama tarihi YYYY-MM-DD (boş = bugün UTC). settle bir önceki günü kapatır."
        default: ""
      limit:
        description: "En fazla maç (boş = hepsi)"
        default: ""
      geo:
        description: "Oran bölgesi (bahisçi listesi buna göre değişir): GB, TR, US, DE..."
        default: "GB"

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

env:
  FLASHSCORE_API_BASE: http://127.0.0.1:8001
  # İncelenmiş, MIT lisanslı sürüme sabitlenmiştir (2026-11-04). Güncellemek için önce kodu inceleyin.
  FLASHSCORE_SCRAPER_SHA: af784a918fc94339fd2c8ff0fadc1da69a6139d8
  ODDS_GEO: ${{ github.event.inputs.geo || 'GB' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Flashscore servisini başlat (sabit sürüm)
        run: |
          git init -q /tmp/fs && cd /tmp/fs
          git remote add origin https://github.com/omkarcloud/flashscore-scraper.git
          git fetch -q --depth 1 origin "$FLASHSCORE_SCRAPER_SHA" && git checkout -q FETCH_HEAD
          python -m pip install -q -r requirements.txt
          PORT=8001 nohup python run.py >/tmp/flashscore.log 2>&1 &
          for i in {1..40}; do curl -fsS "http://127.0.0.1:8001/matches?sport=football" -o /dev/null && exit 0; sleep 2; done
          cat /tmp/flashscore.log; exit 1
      - name: Testler
        run: pip install -q pytest && pytest -q
      - name: Dal doğrulaması (geçmiş gün, sadece push)
        if: github.event_name == 'push'
        run: |
          python daily_pipeline.py scan --date 2026-11-08 --include-finished --limit 8
          python daily_pipeline.py settle --date 2026-11-08
          python - <<'PY'
          import json,glob
          c=json.load(open("daily/2026-11-08/closing.json"))
          print("finished:",sum(v.get("status")=="finished" for v in c.values()),"closing_ok:",sum(bool(v.get("closing_ok")) for v in c.values()),"of",len(c))
          for p in sorted(glob.glob("daily/2026-11-08/packets/*.json")):
              d=json.load(open(p));s=(d["market"]["summary"] or {}).get("1x2") or {}
              print(d["match"]["home"],"-",d["match"]["away"],"| books",s.get("bookmakers"),"| pinnacle",bool(s.get("pinnacle_fair")),"| move",s.get("movement_pp"),"| gaps",d["context"]["data_gaps"])
          for k,v in c.items():
              x=(v.get("closing_summary") or {}).get("1x2") or {}
              print("CLOSE",v["home"],"-",v["away"],v["home_score"],"-",v["away_score"],"| fair",x.get("consensus_fair"),"| best",{s:b["odds"] for s,b in (x.get("best_price") or {}).items()})
          PY
          cat daily/2026-11-08/OZET.md >> "$GITHUB_STEP_SUMMARY"
      - name: Dal doğrulaması (yaklaşan maçlarda sakatlık listesi)
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          from data_adapters import FlashscoreClient
          import daily_pipeline as dp
          fs=FlashscoreClient(); lg=dp.load_leagues(); checked=0
          PRI=["England","Spain","Italy","Germany","France","Brazil","USA","Mexico","Saudi Arabia","World","Europe","Netherlands","Portugal","Turkey"]
          for n in range(0,8):
              d=(date.today()+timedelta(days=n)).isoformat(); r=fs.matches("football",d)
              if not r.ok: print(d,"list failed",r.error); continue
              groups=[g for g in r.data.get("competitions") or [] if ((g.get("competition") or {}).get("category") in PRI) and not dp.VARIANT.search((g.get("competition") or {}).get("name") or "")]
              for g in groups:
                  comp=g.get("competition") or {}
                  for m in (g.get("matches") or [])[:1]:
                      if checked>=18 or m.get("status")!="scheduled": continue
                      mp=fs.missing_players(m["id"])
                      cnt=(mp.data or {}).get("count") if mp.ok else mp.error
                      print("MISSING",d,comp.get("category"),"|",comp.get("name"),"|",m["home"]["name"],"-",m["away"]["name"],"->",cnt,"| target" if dp.league_match(comp,lg) else "")
                      checked+=1
          PY
      - name: Dünü kapat (sonuç + kapanış oranı + CLV)
        if: github.event_name != 'push' && (github.event.inputs.mode || 'both') != 'scan'
        run: |
          D="${{ github.event.inputs.date }}"
          if [ -n "$D" ]; then Y=$(date -u -d "$D -1 day" +%F); else Y=$(date -u -d "yesterday" +%F); fi
          python daily_pipeline.py settle --date "$Y"
          python daily_pipeline.py report
      - name: Bugünü tara
        if: github.event_name != 'push' && (github.event.inputs.mode || 'both') != 'settle'
        run: |
          D="${{ github.event.inputs.date }}"; [ -z "$D" ] && D=$(date -u +%F)
          L="${{ github.event.inputs.limit }}"
          python daily_pipeline.py scan --date "$D" ${L:+--limit $L}
          cat "daily/$D/OZET.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Çıktıları dala kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for d in daily ledger decisions; do [ -e "$d" ] && git add "$d"; done
          git diff --cached --quiet || git commit -q -m "Günlük kanıt taraması $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done; exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flashscore-log
          path: /tmp/flashscore.log
          if-no-files-found: ignore
