name: live-watch

on:
  schedule:
    - cron: "*/5 * * * *"   # 5 dakikada bir; GitHub zamanlaması yoğun saatlerde 5-15 dk gecikebilir
  workflow_dispatch:
    inputs:
      fotmob_id: {description: "Lig listesi dışındaki bir maçı izle (FotMob maç id)", default: ""}

permissions:
  contents: write

concurrency:
  group: live-watch
  cancel-in-progress: false

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  SLACK_LIVE_WEBHOOK_URL: ${{ secrets.SLACK_LIVE_WEBHOOK_URL }}
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
  LIVE_EXTRA_IDS: ${{ vars.LIVE_EXTRA_IDS }}
  LIVE_ACTIONS_OFF: ${{ vars.LIVE_ACTIONS_OFF }}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 30}
      - name: Şu an canlı maç var mı?
        id: due
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, glob
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          due = os.getenv("GITHUB_EVENT_NAME") != "schedule" or bool(os.getenv("LIVE_EXTRA_IDS", "").strip())
          for p in glob.glob("daily/*/fixtures.json"):
              for f in json.load(open(p)):
                  k = datetime.fromisoformat(f["kickoff"].replace("Z", "+00:00"))
                  if -2 <= (now - k).total_seconds() / 60 <= 130: due = True
          if os.getenv("GITHUB_EVENT_NAME") == "schedule" and os.getenv("LIVE_ACTIONS_OFF") == "true": due = False  # laptop çalışıyor
          import subprocess
          recent = subprocess.run(["git", "log", "--since=15 minutes ago", "--grep=(laptop)", "--oneline"], capture_output=True, text=True).stdout.strip()
          if os.getenv("GITHUB_EVENT_NAME") == "schedule" and recent: due = False  # laptop son 15 dk'da veri gönderdi; o çalışıyor
          print(f"due={'true' if due else 'false'}")
          PY
      - uses: actions/setup-python@v5
        if: steps.due.outputs.due == 'true'
        with: {python-version: "3.12"}
      - name: Uyarı kanalı tanımlı mı?
        if: steps.due.outputs.due == 'true' && env.SLACK_WEBHOOK_URL == '' && env.SLACK_LIVE_WEBHOOK_URL == '' && env.NTFY_TOPIC == ''
        run: echo "::warning::SLACK_WEBHOOK_URL / SLACK_LIVE_WEBHOOK_URL / NTFY_TOPIC secret'larının hiçbiri yok; canlı uyarılar Slack'e GİTMEZ, yalnızca daily/<tarih>/live/unsent_alerts.md dosyasına yazılır."
      # GitHub'ın 5 dakikalık zamanlaması pratikte 20-50 dk gecikiyor. Bu yüzden tek çalıştırma içinde
      # 5 dakikada bir, 5 tur (≈25 dk) izleyip her turda kaydediyoruz. Repo herkese açık; Actions dakikası ücretsiz.
      - name: Canlı izle ve kaydet (5 dk arayla 5 tur)
        if: steps.due.outputs.due == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for round in 1 2 3 4 5; do
            start=$(date +%s)
            git pull -q --rebase || true
            python live_watch.py ${{ github.event.inputs.fotmob_id && format('--fotmob-id {0}', github.event.inputs.fotmob_id) || '' }} || echo "tur $round hata verdi, devam"
            if [ -e daily ]; then git add daily; fi
            if ! git diff --cached --quiet; then
              git commit -q -m "Canlı izleme $(date -u +%F\ %H:%M)"
              for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
            fi
            [ "$round" = 5 ] && break
            left=$((300 - ($(date +%s) - start))); [ $left -gt 0 ] && sleep $left
          done
      - name: Arıza bildirimi (Slack webhook tanımlıysa)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' --data "{\"text\":\"⚠️ ${{ github.workflow }} başarısız: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "$SLACK_WEBHOOK_URL"
